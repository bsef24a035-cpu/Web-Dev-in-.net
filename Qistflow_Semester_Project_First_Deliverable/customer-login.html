<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | QistFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="login-page container py-5">
    <section class="login-card">
      <header class="text-center mb-4">
        <!-- The smaller logo is used above the login heading. -->
        <img src="assets/logo-mark.svg" class="logo-mark mb-3" alt="QistFlow emblem">
        <h1>QistFlow</h1>
        <p class="text-secondary">Installment Booking &amp; Verification Management</p>
      </header>

      <nav class="role-switch mb-3" aria-label="Login role">
        <a href="customer-login.html" class="active" aria-current="page">
          <i class="bi bi-person me-1" aria-hidden="true"></i> Customer
        </a>
        <a href="admin-login.html">
          <i class="bi bi-shop me-1" aria-hidden="true"></i> Shop Admin
        </a>
      </nav>

      <div class="bg-white rounded-3 p-3 mb-4 small">
        <i class="bi bi-person-check me-2" aria-hidden="true"></i>
        Sign in to explore products and installment plans.
      </div>

      <form action="customer-home.html" method="get">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
            <input id="email" type="email" class="form-control" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
            <input id="password" type="password" class="form-control" minlength="8" required>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 py-3">Sign In to Customer Portal</button>
        <p class="small text-secondary mt-3">Demo only: opens customer home without checking credentials.</p>
      </form>

      <footer class="text-center mt-4">
        <p>New customer? <a href="customer-register.html">Create an account</a></p>
        <a href="customer-home.html">Back to customer home</a>
      </footer>
    </section>
  </main>
</body>
</html>
